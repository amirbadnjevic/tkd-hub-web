<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Private club page: keep it out of search engines -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#02213e">
  <title>STP TKD Graderingsguide</title>
  <link rel="icon" type="image/png" href="assets/stp/logo.png">
  <link rel="apple-touch-icon" href="assets/stp/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light;
      --navy: #02213e;
      --navy-2: #021A32;
      --blue: #2e65d0;
      --blue-soft: #e6eefc;
      --bg: #eef2f7;
      --surface: #ffffff;
      --line: #d8dfea;
      --text: #0f1b2d;
      --muted: #5b6b80;
      --ok: #178a44;
      --ok-soft: #e3f5ea;
      --bad: #cf2e28;
      --bad-soft: #fbe7e6;
      --radius: 0;
    }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
      -webkit-font-smoothing: antialiased; min-height: 100vh;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    .display { font-family: 'Saira Condensed', 'Arial Narrow', sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1; }
    .hidden { display: none !important; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }

    /* Header */
    .site-header { background: var(--navy) url('assets/stp/header-bg.png') right center / auto 100% no-repeat; color: #fff; }
    .site-header .wrap { display: flex; align-items: center; gap: 18px; min-height: 124px; padding-top: 16px; padding-bottom: 16px; }
    .club-logo { width: 88px; height: auto; flex-shrink: 0; display: block; }
    .home-link { display: flex; align-items: center; gap: inherit; color: inherit; text-decoration: none; }
    .home-link:focus-visible { outline: 3px solid #9fbaf0; outline-offset: 4px; }
    .site-header h1 { font-size: clamp(1.7rem, 7vw, 2.6rem); }
    .site-header h1 small { display: block; font-family: 'Inter', sans-serif; font-weight: 500; text-transform: none; letter-spacing: 0; font-size: clamp(0.75rem, 3.2vw, 0.9rem); color: #a9bad3; margin-top: 6px; line-height: 1.35; }
    @media (max-width: 560px) {
      .site-header .wrap { min-height: 92px; gap: 12px; padding-top: 12px; padding-bottom: 12px; }
      .club-logo { width: 60px; }
    }

    /* Tabs */
    .tabs { position: sticky; top: 0; z-index: 10; background: var(--navy-2); border-bottom: 3px solid var(--blue); box-shadow: 0 4px 14px rgba(2,33,62,.18); }
    .tabs .wrap { display: flex; justify-content: center; padding-top: 10px; padding-bottom: 10px; }
    .tabs [role="tablist"] { display: grid; grid-template-columns: 1fr 1fr; width: 100%; max-width: 440px; border: 2px solid #2b4a6f; }
    .tab {
      background: transparent; border: 0; padding: 12px 16px; min-height: 52px;
      font-family: 'Saira Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 1.25rem;
      text-transform: uppercase; letter-spacing: 0.1em; color: #a9bad3;
      display: flex; align-items: center; justify-content: center; gap: 10px; transition: background .15s, color .15s;
    }
    .tab + .tab { border-left: 2px solid #2b4a6f; }
    .tab:hover { color: #fff; }
    .tab[aria-selected="true"] { background: var(--blue); color: #fff; }
    .tab svg { width: 20px; height: 20px; }

    main.wrap { padding-top: 20px; padding-bottom: 48px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 0; }
    .eyebrow { font-family: 'Saira Condensed', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.16em; font-size: 0.8rem; color: var(--blue); }

    /* Belt picker */
    /* Belt picker: boxless, bar + label, navy underline on the selected belt(s) */
    .belt-row { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 14px 10px; margin-bottom: 18px; }
    @media (max-width: 640px) { .belt-row { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
    .belt-btn {
      background: none; border: 0; border-bottom: 3px solid transparent; border-radius: 0;
      padding: 8px 0 7px; min-height: 52px; display: flex; flex-direction: column; align-items: center; gap: 7px;
      font-family: 'Saira Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 1rem; letter-spacing: 0.04em;
      color: var(--muted); transition: border-color .15s, color .15s;
    }
    @media (hover: hover) { .belt-btn:hover { color: var(--navy); border-bottom-color: #b9c6da; } }
    .belt-btn[aria-pressed="true"] { color: var(--navy); border-bottom-color: var(--navy); }
    .belt-btn svg { width: 100%; max-width: 62px; height: auto; transition: transform .15s; }
    .belt-btn[aria-pressed="true"] svg { transform: translateY(-2px); filter: drop-shadow(0 3px 3px rgba(2,33,62,.25)); }
    .belt-btn .chk { display: none; }
    .belt-row.multi .belt-btn[aria-pressed="true"] .chk { display: inline; color: var(--blue); margin-left: 3px; }

    /* Belt path (belt pages): dots on a line 9 -> 1, earlier belts filled in */
    .path { --count: 9; --dot: 26px; --pad: 6px; position: relative; display: grid; grid-template-columns: repeat(var(--count), minmax(0, 1fr)); margin: 4px 0 18px; }
    /* line runs from the first to the last dot centre, through the middle of the dots:
       top padding + half a dot - half the line */
    .path::before, .path .fill { content: ''; position: absolute; left: calc(100% / (2 * var(--count))); top: calc(var(--pad) + var(--dot) / 2 - 2px); height: 4px; background: #c9d3e1; }
    .path::before { right: calc(100% / (2 * var(--count))); }
    .path .fill { background: var(--navy); }
    .path button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: var(--pad) 0 4px; background: none; border: 0; min-height: 56px; }
    .path .dot {
      position: relative; width: var(--dot); height: var(--dot); border-radius: 50%; overflow: hidden; flex-shrink: 0;
      border: 3px solid var(--bg); box-shadow: 0 0 0 1.5px #9aa8bb; transition: box-shadow .15s;
    }
    /* Fixed whole-px stripe widths and gaps so every stripe is equally thick. The 1.4x current dot
       scales them all by the same amount (e.g. 2.8px each), so they stay equal there too. */
    .path .dot .sg { position: absolute; top: 0; bottom: 0; right: 3px; display: flex; gap: 2px; }
    .path .dot .sg i { width: 3px; }
    @media (hover: hover) { .path button:hover .dot { box-shadow: 0 0 0 2px var(--navy); } }
    .path button[aria-current="true"] .dot { transform: scale(1.4); box-shadow: 0 0 0 2.5px var(--navy); }
    .path .n { font-family: 'Saira Condensed', sans-serif; font-weight: 700; font-size: 1rem; color: var(--muted); line-height: 1; margin-top: 2px; white-space: nowrap; }
    .path button[aria-current="true"] .n { color: var(--navy); }
    .path .n small { font-size: 0.8em; letter-spacing: 0.06em; }

    /* Learn detail */
    .belt-head { padding: 20px; display: flex; gap: 18px; align-items: center; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .belt-head .big-belt { width: 120px; flex-shrink: 0; }
    .belt-head .big-belt svg { width: 100%; height: auto; display: block; }
    .belt-head h2 { font-size: 2.2rem; color: var(--navy); }
    .belt-head .sub { color: var(--muted); font-weight: 500; margin-top: 4px; }
    .belt-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    /* Buttons: solid navy (secondary) / club blue (primary), condensed caps like the tabs */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 48px; padding: 0 20px; border: 0; border-radius: 0;
      background: var(--navy); color: #fff; text-decoration: none;
      font-family: 'Saira Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 1.08rem;
      text-transform: uppercase; letter-spacing: 0.08em; line-height: 1.1;
      transition: background .15s, transform .08s;
    }
    .btn:hover { background: #0b3a66; }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible { outline: 3px solid #9fbaf0; outline-offset: 2px; }
    .btn.primary { background: var(--blue); }
    .btn.primary:hover { background: #2556b8; }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    .toggle { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: #f7f9fc; font-size: 0.92rem; color: var(--muted); cursor: pointer; user-select: none; }
    .toggle input { width: 18px; height: 18px; accent-color: var(--blue); }
    .note { padding: 12px 20px 0; font-size: 0.88rem; color: var(--muted); font-style: italic; }

    .sections { padding: 8px 20px 20px; }
    .sec { padding: 14px 0; border-bottom: 1px solid #edf1f6; }
    .sec:last-child { border-bottom: 0; }
    .sec h3 { font-family: 'Saira Condensed', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 1.05rem; color: var(--navy); margin-bottom: 6px; }
    .items { list-style: none; }
    .items li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 16px; padding: 6px 0; align-items: baseline; }
    .items li.text { grid-template-columns: 1fr; }
    .items .ko { font-weight: 600; }
    .items .sv { color: var(--muted); font-weight: 600; }
    .items .from { display: inline-block; font-size: 0.7rem; font-weight: 600; color: var(--muted); background: #eef2f7; border-radius: 0; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
    .items li.inherited .ko, .items li.inherited .sv { font-weight: 500; }
    .items li.has-media { align-items: center; }
    .items li.has-media .sv { display: flex; align-items: center; gap: 12px; }
    .media-row { display: flex; gap: 18px; margin-left: auto; }
    .media .short { display: none; }
    .media {
      display: inline-flex; align-items: center; gap: 6px; min-height: 32px;
      color: var(--blue); font-weight: 600; font-size: 0.92rem; text-decoration: none;
    }
    .media svg { width: 17px; height: 17px; flex-shrink: 0; }
    .media:hover .lbl { text-decoration: underline; text-underline-offset: 3px; }
    .items li.inherited .ko { color: #33445b; }
    @media (max-width: 560px) {
      .items li { grid-template-columns: 1fr; gap: 0; }
      .media-row { gap: 14px; }
      .media .full { display: none; }
      .media .short { display: inline; }
      .belt-head .actions { margin-left: 0; width: 100%; }
      .belt-head .actions { flex-direction: column-reverse; }
      .belt-head .actions .btn { width: 100%; }
    }

    /* Search */
    .search { position: relative; margin-bottom: 14px; }
    .search input {
      width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--surface);
      padding: 13px 46px 13px 46px; border: 2px solid var(--line); border-radius: 0; outline: none;
      -webkit-appearance: none; appearance: none;
    }
    .search input:focus { border-color: var(--blue); }
    .search input::placeholder { color: #8a97a8; }
    .search input::-webkit-search-cancel-button { display: none; }
    .search > svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
    .search button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; background: none; border: 0; color: var(--muted); font-size: 1.05rem; }
    .search button:hover { color: var(--navy); }
    .s-count { color: var(--muted); font-size: 0.9rem; margin: 0 0 8px; }
    .s-results { list-style: none; background: var(--surface); border: 1px solid var(--line); }
    .s-results li + li { border-top: 1px solid #edf1f6; }
    .s-hit { width: 100%; text-align: left; background: none; border: 0; display: flex; align-items: center; gap: 14px; padding: 12px 16px; min-height: 60px; }
    .s-hit:hover { background: var(--blue-soft); }
    .s-main { flex: 1; min-width: 0; }
    .s-ko { display: block; font-weight: 600; color: var(--text); }
    .s-sv { display: block; color: var(--muted); font-size: 0.9rem; font-weight: 500; margin-top: 1px; }
    .s-belt { display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0; width: 56px; font-size: 0.74rem; font-weight: 700; color: var(--muted); }
    .s-belt svg { width: 40px; height: auto; }
    .s-empty { padding: 22px 16px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
    mark { background: #fff0a8; color: inherit; }
    .items li { scroll-margin-top: 110px; }
    .items li.flash { animation: flash 2.8s ease-out; }
    @keyframes flash {
      0%, 40% { background: #fff0a8; box-shadow: 0 0 0 8px #fff0a8; }
      100% { background: transparent; box-shadow: 0 0 0 8px transparent; }
    }

    /* Landing */
    .landing { padding: 24px 20px; }
    .landing h2 { font-size: clamp(2rem, 8vw, 2.6rem); color: var(--navy); margin: 6px 0 10px; }
    .landing .lead { color: var(--muted); font-size: 1.02rem; }
    .quote {
      margin-top: 22px; text-align: center;
      font-family: 'Caveat', 'Segoe Script', 'Bradley Hand', cursive; font-weight: 700;
      font-size: clamp(1.6rem, 6.4vw, 2.1rem); line-height: 1.15; color: var(--navy);
    }
    .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
    .mode {
      text-align: left; display: flex; gap: 14px; align-items: flex-start; padding: 16px;
      background: #f7f9fc; border: 1.5px solid var(--line); border-left: 4px solid var(--blue); color: var(--muted); font-size: 0.92rem;
    }
    .mode:hover { border-color: var(--blue); background: var(--blue-soft); }
    .mode svg { width: 26px; height: 26px; color: var(--blue); flex-shrink: 0; margin-top: 2px; }
    .mode strong { display: block; font-family: 'Saira Condensed', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 1.2rem; color: var(--navy); margin-bottom: 2px; }
    .pick { margin: 26px 0 8px; }
    .pick-title { font-family: 'Saira Condensed', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 1.25rem; color: var(--navy); margin-bottom: 10px; }
    .about { padding: 22px 20px; margin-top: 18px; color: #33445b; }
    .about h3 { font-family: 'Saira Condensed', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 1.25rem; color: var(--navy); margin-bottom: 8px; }
    .about h4 { color: var(--navy); margin: 16px 0 6px; font-size: 0.98rem; }
    .about p + p { margin-top: 10px; }
    .about ul { padding-left: 20px; }
    .about li { margin: 3px 0; }
    .about p a { color: var(--blue); font-weight: 600; }
    .about .more { display: inline-block; margin-top: 14px; color: var(--blue); font-weight: 600; }
    .back { background: none; border: 0; color: var(--blue); font-weight: 600; padding: 0 0 12px; font-size: 0.95rem; }
    @media (max-width: 560px) {
      .modes { grid-template-columns: 1fr; }
      .landing, .about { padding: 18px 16px; }
    }

    /* Practice setup */
    .setup { padding: 20px; }
    .setup h2 { font-size: 1.9rem; color: var(--navy); margin: 4px 0 6px; }
    .setup p.lead { color: var(--muted); margin-bottom: 18px; }
    .field { margin-top: 18px; }
    .field > label, .field > .lbl { display: block; font-weight: 600; margin-bottom: 8px; color: var(--navy); }
    .seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 0; overflow: hidden; }
    .seg button { border: 0; background: var(--surface); padding: 9px 16px; font-weight: 600; color: var(--muted); }
    .seg button + button { border-left: 1.5px solid var(--line); }
    .seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }
    .check { display: flex; gap: 10px; align-items: flex-start; color: var(--text); cursor: pointer; }
    .check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--blue); flex-shrink: 0; }
    .check span small { display: block; color: var(--muted); font-size: 0.85rem; }
    .start-row { margin-top: 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .start-row .count { color: var(--muted); font-size: 0.9rem; }

    /* Quiz */
    .quiz { padding: 20px; }
    .progress { height: 6px; background: #e3e9f2; border-radius: 0; overflow: hidden; }
    .progress > div { height: 100%; background: var(--blue); width: 0; transition: width .25s; }
    .qmeta { display: flex; justify-content: space-between; align-items: center; margin: 14px 0 6px; font-size: 0.85rem; color: var(--muted); gap: 10px; }
    .qtag { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
    .qtag svg { width: 34px; height: auto; }
    .question { font-size: clamp(1.2rem, 4.4vw, 1.5rem); font-weight: 700; color: var(--navy); margin: 8px 0 18px; line-height: 1.3; }
    .question em { font-style: normal; color: var(--blue); }
    .options { display: grid; gap: 10px; }
    .opt {
      text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 0;
      padding: 14px 16px; font-weight: 500; font-size: 1rem; display: flex; gap: 12px; align-items: center;
      transition: border-color .12s, background .12s;
    }
    .opt:hover:not(:disabled) { border-color: var(--blue); background: #f6f9ff; }
    .opt .key { width: 26px; height: 26px; border-radius: 0; background: #eef2f7; display: grid; place-items: center; font-size: 0.8rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
    .opt:disabled { cursor: default; }
    .opt.correct { border-color: var(--ok); background: var(--ok-soft); }
    .opt.correct .key { background: var(--ok); color: #fff; }
    .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
    .opt.wrong .key { background: var(--bad); color: #fff; }
    .feedback { margin-top: 16px; min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .feedback .msg { font-weight: 600; }
    .feedback .msg.ok { color: var(--ok); }
    .feedback .msg.bad { color: var(--bad); }
    .quiz-foot { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); }
    .linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; }

    /* Result */
    .result { padding: 28px 20px; text-align: center; }
    .score { font-size: clamp(4rem, 18vw, 6rem); color: var(--navy); }
    .score span { color: var(--muted); font-size: 0.45em; }
    .result .verdict { font-weight: 600; font-size: 1.1rem; margin: 6px 0 20px; }
    .result .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .missed { text-align: left; margin-top: 26px; border-top: 1px solid var(--line); padding-top: 18px; }
    .missed h3 { font-family: 'Saira Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.08em; color: var(--navy); margin-bottom: 8px; }
    .missed li { list-style: none; padding: 10px 0; border-bottom: 1px solid #edf1f6; }
    .missed li:last-child { border-bottom: 0; }
    .missed .q { font-weight: 600; }
    .missed .a { color: var(--ok); font-size: 0.92rem; }
    .missed .y { color: var(--bad); font-size: 0.92rem; text-decoration: line-through; }
    .missed .src { color: var(--muted); font-size: 0.78rem; }

    /* Gate */
    .gate {
      position: fixed; inset: 0; z-index: 50; background: var(--navy);
      background-image: radial-gradient(circle at 50% 0%, #0b3a66 0%, var(--navy) 60%);
      display: grid; place-items: center; padding: 16px; color: #fff;
    }
    .gate-box { width: 100%; max-width: 360px; text-align: center; }
    .gate-box img { width: 108px; height: auto; margin-bottom: 18px; }
    .gate-box h1 { font-size: 2rem; }
    .gate-box p { color: #a9bad3; margin: 8px 0 22px; font-size: 0.95rem; }
    .gate-box form { display: flex; flex-direction: column; gap: 10px; }
    .gate-box input {
      font: inherit; font-size: 1.05rem; text-align: center; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 13px 14px; border-radius: 0; border: 1.5px solid #29496d; background: #062b4f; color: #fff; outline: none;
    }
    .gate-box input:focus { border-color: var(--blue); }
    .gate-box input::placeholder { color: #6f88a8; letter-spacing: 0.04em; text-transform: none; }
    .gate-box .err { color: #ff8f8a; font-size: 0.9rem; min-height: 1.3em; }
    .gate-box.shake { animation: shake .35s; }
    @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

    /* Phones */
    @media (max-width: 560px) {
      .wrap { padding-left: 12px; padding-right: 12px; }
      main.wrap { padding-top: 14px; }
      .belt-row { gap: 12px 8px; }
      .belt-btn { font-size: 0.95rem; }
      .path { --dot: 22px; }
      .path .dot .sg { right: 2px; gap: 3px; }
      .path .dot .sg i { width: 2px; }
      .belt-head { padding: 16px; gap: 14px; }
      .belt-head .big-belt { width: 96px; }
      .belt-head h2 { font-size: 1.9rem; }
      .toggle { padding: 12px 16px; }
      .note { padding: 12px 16px 0; }

      .seg { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; }
      .seg button { padding: 12px 0; }
      .start-row .btn, #selAll { width: 100%; }
      .start-row { flex-direction: column; align-items: stretch; text-align: center; }
      .opt { min-height: 56px; }
      .feedback .btn { width: 100%; }
      .result .actions { flex-direction: column; }
      .result .actions .btn { width: 100%; }

    }
    @media (max-width: 360px) { .belt-row { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

    footer { text-align: center; font-size: 0.8rem; color: var(--muted); padding: 0 16px 32px; }
    footer a { color: var(--muted); }
    .loading { padding: 40px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>

  <!-- Access gate (front-end only) -->
  <div class="gate" id="gate">
    <div class="gate-box" id="gateBox">
      <img src="assets/stp/logo.png" alt="Staffanstorps Taekwondo Förening">
      <h1 class="display">Graderingsguide</h1>
      <p>Endast för medlemmar i Staffanstorps Taekwondo Förening. Ange klubbens kod.</p>
      <form id="gateForm" autocomplete="off">
        <input id="gateInput" type="text" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="Kod" aria-label="Kod" required>
        <button class="btn primary" type="submit">Öppna</button>
        <div class="err" id="gateErr" role="alert"></div>
      </form>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="site-header">
      <div class="wrap">
        <a class="home-link" href="#lar" id="homeLink" aria-label="Graderingsguide, startsida">
          <img class="club-logo" src="assets/stp/logo.png" alt="Staffanstorps Taekwondo Förening">
          <h1 class="display">Graderingsguide<small>Staffanstorps Taekwondo Förening</small></h1>
        </a>
      </div>
    </header>
    <nav class="tabs" aria-label="Sektioner">
      <div class="wrap"><div role="tablist">
        <button class="tab" role="tab" data-tab="learn" aria-selected="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2z"/><path d="M22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/></svg>
          Lär dig
        </button>
        <button class="tab" role="tab" data-tab="practice" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
          Öva
        </button>
      </div></div>
    </nav>

    <main class="wrap">
      <div id="view"><div class="loading">Laddar…</div></div>
    </main>

    <footer>
      Innehåll från Staffanstorps Taekwondo Förenings officiella graderingskrav.
      <a href="https://www.stptkd.se/sida/67035/grader-gradering" target="_blank" rel="noopener noreferrer">stptkd.se</a>
    </footer>
  </div>

<script>
(() => {
  'use strict';

  /* ---------- Access gate ----------
     Front-end only: keeps casual visitors out, not a real security boundary.
     The code is compared case-insensitively, ignoring spaces and dashes.
     To change it: run  cyrb53(normCode('NEW-CODE'))  in the browser console
     on this page and paste the result into ACCESS_HASH. */
  const ACCESS_HASH = '10yl6j5agh7';
  const STORE_KEY = 'stp-gradering-access';

  function cyrb53(str, seed = 0) {
    let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  }
  const normCode = s => s.toUpperCase().replace(/[^A-Z0-9ÅÄÖ]/g, '');
  window.cyrb53 = cyrb53; window.normCode = normCode;

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } },
  };

  const gate = document.getElementById('gate');
  const gateForm = document.getElementById('gateForm');
  const gateInput = document.getElementById('gateInput');
  const gateErr = document.getElementById('gateErr');
  const gateBox = document.getElementById('gateBox');

  function unlock() {
    gate.remove();
    document.getElementById('app').classList.remove('hidden');
    boot();
  }
  if (store.get(STORE_KEY) === ACCESS_HASH) unlock();
  else gateInput.focus();

  gateForm.addEventListener('submit', e => {
    e.preventDefault();
    if (cyrb53(normCode(gateInput.value)) === ACCESS_HASH) {
      store.set(STORE_KEY, ACCESS_HASH);
      unlock();
    } else {
      gateErr.textContent = 'Fel kod, försök igen.';
      gateBox.classList.remove('shake'); void gateBox.offsetWidth; gateBox.classList.add('shake');
      gateInput.select();
    }
  });

  /* ---------- Helpers ---------- */
  const $view = () => document.getElementById('view');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const normTxt = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');

  /* Flat belt bar with square ends; stripes sit near the right end. */
  function beltSvg(b, w = 64) {
    const W = 64, H = 14, h = Math.round(w * H / W);
    let stripes = '';
    for (let i = 0; i < (b.stripes || 0); i++) {
      stripes += `<rect x="${W - 8 - (i + 1) * 4 - i * 2.5}" y="0" width="4" height="${H}" fill="${b.stripe}"/>`;
    }
    return `<svg viewBox="0 0 ${W} ${H}" width="${w}" height="${h}" aria-hidden="true">
      <rect width="${W}" height="${H}" fill="${b.base}"/>${stripes}
      <rect width="${W}" height="${H / 2.6}" fill="#fff" opacity=".18"/>
      <rect x=".5" y=".5" width="${W - 1}" height="${H - 1}" fill="none" stroke="rgba(0,0,0,.2)"/></svg>`;
  }

  /* ---------- Data ---------- */
  let DATA = null;
  const CUMULATIVE = ['poomse', 'stallningar', 'slag', 'stot', 'blockeringar', 'sparkar', 'teori'];
  const ORDER = ['poomse', 'stallningar', 'slag', 'stot', 'blockeringar', 'sparkar', 'mittsteknik', 'kamp', 'enstegskamp', 'krossteknik', 'armhavning', 'betydelse', 'teori', 'ovrigt', 'tidskrav'];
  const beltBy = g => DATA.belts.find(b => b.gup === g);

  /* ---------- State / routing ---------- */
  const state = {
    tab: 'learn',
    learnGup: null,            // null = landing page
    search: '',
    learnAll: false,
    practice: { gups: new Set([9]), cumulative: true, count: 10 },
    quiz: null,
  };

  function currentHash() {
    return '#' + (state.tab === 'learn' ? (state.learnGup ? 'lar/' + state.learnGup : 'lar') : 'ova');
  }
  /* Add a browser history entry for the current view (skipped when we got here via Back/Forward). */
  function pushView() {
    if (location.hash !== currentHash()) history.pushState(null, '', currentHash());
  }
  function setTab(tab, push = true) {
    state.tab = tab;
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === tab)));
    if (push) pushView();
    render();
    window.scrollTo({ top: 0 });
  }

  function readHash() {
    const h = location.hash.replace('#', '');
    const m = h.match(/^lar\/(\d)$/);
    if (m && beltBy(+m[1])) { state.learnGup = +m[1]; state.tab = 'learn'; }
    else if (h === 'ova') state.tab = 'practice';
    else { state.learnGup = null; state.tab = 'learn'; }
  }

  async function boot() {
    try {
      const res = await fetch('assets/stp/grading.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error(res.status);
      DATA = await res.json();
      DATA.belts.sort((a, b) => b.gup - a.gup);   // 9 GUP first; picker, path and quiz rely on this order
    } catch (e) {
      $view().innerHTML = `<div class="card loading">Kunde inte ladda graderingsdata. Ladda om sidan.</div>`;
      return;
    }
    readHash();
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
      if (t.dataset.tab === 'learn' && state.tab === 'learn') state.learnGup = null;
      setTab(t.dataset.tab);
    }));
    window.addEventListener('popstate', () => { state.search = history.state?.q || ''; readHash(); setTab(state.tab, false); });
    document.getElementById('homeLink').addEventListener('click', e => {
      e.preventDefault();
      state.search = '';
      state.learnGup = null;
      setTab('learn');
    });
    document.addEventListener('keydown', onKey);
    setTab(state.tab, false);
  }

  function render() {
    if (state.tab === 'learn') renderLearn();
    else if (state.quiz && state.quiz.done) renderResult();
    else if (state.quiz) renderQuestion();
    else renderSetup();
  }

  /* ---------- Learn ---------- */
  function beltPicker(selected, multi) {
    const btns = DATA.belts.map(b => `
      <button class="belt-btn" data-gup="${b.gup}" aria-pressed="${multi ? selected.has(b.gup) : selected === b.gup}" title="${esc(b.color)}">
        ${beltSvg(b.belt)}<span>${b.gup} GUP<span class="chk" aria-hidden="true">✓</span></span>
      </button>`).join('');
    return `<div class="belt-row${multi ? ' multi' : ''}">${btns}</div>`;
  }

  /* Belt pages: the road from 9 GUP to 1 GUP; belts before the current one are filled in. */
  function beltPath(current) {
    const idx = DATA.belts.findIndex(b => b.gup === current);
    const dots = DATA.belts.map(b => {
      // Stripes: equal whole-pixel widths/gaps (set in CSS), anchored a few px from the right edge.
      const n = b.belt.stripes || 0;
      const st = n ? `<span class="sg">${`<i style="background:${b.belt.stripe}"></i>`.repeat(n)}</span>` : '';
      return `<button data-gup="${b.gup}" aria-current="${b.gup === current}" aria-label="${b.gup} GUP, ${esc(b.color.toLowerCase())}" title="${esc(b.color)}">
        <span class="dot" style="background:${b.belt.base}">${st}</span><span class="n">${b.gup}${b.gup === current ? '<small> GUP</small>' : ''}</span></button>`;
    }).join('');
    const count = DATA.belts.length;
    return `<nav class="path" aria-label="Bälten" style="--count:${count}"><span class="fill" style="width:calc(${idx} * 100% / ${count})"></span>${dots}</nav>`;
  }

  function selectLearnBelt(g) {
    state.learnGup = g;
    pushView();
    renderLearn();
    window.scrollTo({ top: 0 });
  }

  function renderLanding() {
    $view().innerHTML = learnShell(`
      <section class="card landing">
        <div class="eyebrow">Välkommen</div>
        <h2 class="display">Inför graderingen</h2>
        <p class="lead">Här hittar du klubbens graderingskrav för alla GUP-grader, samlade på ett ställe.
          Läs på om vad du ska kunna till ditt nästa bälte, och testa sedan dig själv tills du kan allt.</p>
        <div class="modes">
          <button class="mode" data-go="learn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2z"/><path d="M22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/></svg>
            <span><strong>Lär dig</strong>Välj ditt bälte och se vad som krävs: poomse, tekniker, kamp, krossteknik och teori, på koreanska och svenska.</span>
          </button>
          <button class="mode" data-go="practice">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
            <span><strong>Öva</strong>Quiz med tre svarsalternativ. Öva på ett bälte eller blanda flera, och repetera de frågor du missar.</span>
          </button>
        </div>
        ${DATA.quote ? `<blockquote class="quote">”${esc(DATA.quote)}”</blockquote>` : ''}
      </section>

      <section class="pick">
        <h3 class="pick-title">Vilket bälte ska du gradera till?</h3>
        ${beltPicker(null, false)}
      </section>

      ${DATA.beltKnot ? `<section class="card about">
        <h3>Hur knyter man bältet?</h3>
        <p>${esc(DATA.beltKnot.text)}</p>
        <p><a href="${esc(DATA.beltKnot.pdf)}" target="_blank" rel="noopener noreferrer">Klicka här för en instruktion.</a></p>
      </section>` : ''}

      <section class="card about">
        <h3>Om gradering</h3>
        <p>Elevgraderna kallas <strong>GUP</strong> och räknas ner mot 1 GUP. De svarta bältena kallas <strong>DAN</strong>.</p>
        <p>Graderingen är ett prov där du visar dina kunskaper inför instruktören. Du examineras på det du lärt dig under terminen: nya tekniker och bättre utförande av de gamla. Klarar du graderingen får du en ny färg på bältet.</p>
        <p>I Staffanstorps TKD kan du gradera efter en termins träning om du uppfyller kraven. Efter 4 GUP ökar kraven och takten kan bli långsammare, till exempel en gång per år.</p>
        <h4>För att få gradera</h4>
        <ul>
          <li>Medlems- och träningsavgiften är betald</li>
          <li>Instruktören har gett sitt godkännande (tillräcklig närvaro under terminen)</li>
          <li>Du har en dräkt (dobok)</li>
        </ul>
        <a class="more" href="https://www.stptkd.se/sida/67035/grader-gradering" target="_blank" rel="noopener noreferrer">Läs mer på stptkd.se</a>
      </section>`);
    wireSearch();

    $view().querySelectorAll('.belt-btn').forEach(btn => btn.addEventListener('click', () => selectLearnBelt(+btn.dataset.gup)));
    $view().querySelector('[data-go="learn"]').addEventListener('click', () =>
      document.querySelector('.pick').scrollIntoView({ behavior: 'smooth', block: 'start' }));
    $view().querySelector('[data-go="practice"]').addEventListener('click', () => setTab('practice'));
  }

  /* ---------- Search (Lär dig) ---------- */
  const itemKey = (key, it) => key + '|' + normTxt(it.ko || '') + '|' + normTxt(it.sv || it.text || '');

  let INDEX = null;
  function searchIndex() {
    if (INDEX) return INDEX;
    const seen = new Set(); INDEX = [];
    for (const b of DATA.belts) {
      for (const key of ORDER) {
        for (const it of b.content[key] || []) {
          const k = itemKey(key, it);
          // Techniques/theory carry over, so list them once under the belt that introduces them (9 GUP first).
          // Per-grading requirements (kamp, krossteknik, armhävning, tidskrav …) are listed for every belt.
          const seenKey = CUMULATIVE.includes(key) ? k : b.gup + '#' + k;
          if (seen.has(seenKey)) continue;
          seen.add(seenKey);
          INDEX.push({ gup: b.gup, key, k, it,
            fields: [it.ko, it.sv, it.text, DATA.sections[key]].filter(Boolean).map(fuzzy) });
        }
      }
    }
    return INDEX;
  }
  /* Case, accents, spaces, hyphens and doubled letters are ignored (dobok = Doobok, ki app = Kii App). */
  const fuzzy = s => normTxt(s).replace(/(.)\1+/g, '$1');
  /* Whole phrase first; if that finds nothing, every word must match somewhere. */
  function runSearch(q) {
    const phrase = fuzzy(q);
    if (!phrase) return [];
    const idx = searchIndex();
    const has = (e, t) => e.fields.some(f => f.includes(t));
    const exact = idx.filter(e => has(e, phrase));
    if (exact.length) return exact;
    const toks = q.trim().split(/\s+/).map(fuzzy).filter(Boolean);
    return toks.length > 1 ? idx.filter(e => toks.every(t => has(e, t))) : [];
  }
  /* Highlight what the search matched, using the same rules as fuzzy(): map each kept
     character of the normalised text back to its span in the original string. */
  function hl(str, q) {
    const norm = [], end = [];
    for (let i = 0; i < str.length; i++) {
      const c = str[i].normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
      if (!/^[a-z0-9]$/.test(c)) continue;
      if (norm.length && norm[norm.length - 1] === c) { end[end.length - 1] = i; continue; }
      norm.push(c); end.push(i);
    }
    const n = norm.join(''), on = new Array(str.length).fill(false);
    const mark = t => {
      for (let i = n.indexOf(t); t && i >= 0; i = n.indexOf(t, i + 1))
        for (let j = end[i]; j <= end[i + t.length - 1]; j++) on[j] = true;   // end[i]: last copy of a doubled first letter
    };
    const phrase = fuzzy(q);
    if (n.includes(phrase)) mark(phrase);
    else q.trim().split(/\s+/).map(fuzzy).filter(t => t.length > 1).forEach(mark);
    let out = '', open = false;
    for (let i = 0; i < str.length; i++) {
      if (on[i] !== open) { out += on[i] ? '<mark>' : '</mark>'; open = on[i]; }
      out += esc(str[i]);
    }
    return out + (open ? '</mark>' : '');
  }

  function learnShell(body) {
    return `
      <div class="search" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" value="${esc(state.search)}" placeholder="Sök teknik eller term, t.ex. naeryo" aria-label="Sök"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button id="qClear" type="button" aria-label="Rensa sökning" hidden>✕</button>
      </div>
      <div id="learnBody">${body}</div>
      <div id="searchResults" hidden></div>`;
  }

  function showResults() {
    const q = state.search, has = q.trim().length > 0;
    const body = document.getElementById('learnBody'), box = document.getElementById('searchResults');
    document.getElementById('qClear').hidden = !has;
    body.hidden = has; box.hidden = !has;
    if (!has) { box.innerHTML = ''; return; }
    const hits = runSearch(q);
    if (!hits.length) { box.innerHTML = `<div class="s-empty">Inga träffar för ”${esc(q.trim())}”.</div>`; return; }
    box.innerHTML = `
      <p class="s-count">${hits.length} ${hits.length === 1 ? 'träff' : 'träffar'}</p>
      <ul class="s-results">${hits.map(e => {
        const b = beltBy(e.gup), it = e.it, sec = esc(DATA.sections[e.key]);
        const main = it.text ? hl(it.text, q) : hl(it.ko, q);
        const sub = it.text ? sec : `${it.sv ? hl(it.sv, q) + ' · ' : ''}${sec}`;
        return `<li><button class="s-hit" data-gup="${e.gup}" data-k="${esc(e.k)}">
          <span class="s-main"><span class="s-ko">${main}</span><span class="s-sv">${sub}</span></span>
          <span class="s-belt">${beltSvg(b.belt, 40)}<span>${e.gup} GUP</span></span></button></li>`;
      }).join('')}</ul>`;
    box.querySelectorAll('.s-hit').forEach(btn => btn.addEventListener('click', () => openHit(+btn.dataset.gup, btn.dataset.k)));
  }

  function openHit(gup, k) {
    history.replaceState({ q: state.search }, '', location.hash);   // Back restores these results
    state.search = '';
    state.learnGup = gup;
    pushView();
    renderLearn();
    const row = [...document.querySelectorAll('.items li[data-k]')].find(li => li.dataset.k === k);
    if (!row) return window.scrollTo({ top: 0 });
    row.scrollIntoView({ block: 'center' });
    row.classList.add('flash');
  }

  function wireSearch() {
    const input = document.getElementById('q');
    input.addEventListener('input', () => { state.search = input.value; showResults(); });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') input.blur();                       // closes the phone keyboard
      if (e.key === 'Escape') { input.value = state.search = ''; showResults(); }
    });
    document.getElementById('qClear').addEventListener('click', () => { input.value = state.search = ''; showResults(); input.focus(); });
    if (state.search) showResults();
  }

  /* PDF guide + film buttons (used for poomse). */
  function mediaLinks(it) {
    if (!it.pdf && !it.video) return '';
    const a = (cls, href, icon, label) => `<a class="media ${cls}" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${icon}<span class="lbl">${label}</span></a>`;
    const doc = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/></svg>';
    const play = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M10 8.5v7l5.5-3.5z" fill="currentColor"/></svg>';
    return `<span class="media-row">${it.pdf ? a('pdf', it.pdf, doc, '<span class="full">Guide (PDF)</span><span class="short">PDF</span>') : ''}${it.video ? a('film', it.video, play, 'Film') : ''}</span>`;
  }

  function renderLearn() {
    if (!state.learnGup) return renderLanding();
    const belt = beltBy(state.learnGup);
    const all = state.learnAll && belt.inherits;
    const prev = DATA.belts.filter(b => b.gup > belt.gup);

    const secs = ORDER.map(key => {
      let items = (belt.content[key] || []).map(it => ({ ...it, gup: belt.gup }));
      if (all && CUMULATIVE.includes(key)) {
        const older = prev.flatMap(b => (b.content[key] || []).map(it => ({ ...it, gup: b.gup, inherited: true })));
        const seen = new Set();
        items = [...older, ...items].filter(it => {
          const k = itemKey(key, it);
          return seen.has(k) ? false : (seen.add(k), true);
        });
      }
      if (!items.length) return '';
      const lis = items.map(it => {
        const from = it.inherited ? `<span class="from">${it.gup} GUP</span>` : '';
        const dk = esc(itemKey(key, it));
        if (it.text) return `<li data-k="${dk}" class="text ${it.inherited ? 'inherited' : ''}"><span>${esc(it.text)}${from}</span></li>`;
        const media = mediaLinks(it);
        return `<li data-k="${dk}" class="${it.inherited ? 'inherited' : ''}${media ? ' has-media' : ''}"><span class="ko">${esc(it.ko)}${from}</span><span class="sv">${esc(it.sv)}${media}</span></li>`;
      }).join('');
      return `<div class="sec"><h3>${esc(DATA.sections[key])}</h3><ul class="items">${lis}</ul></div>`;
    }).join('');

    $view().innerHTML = learnShell(`
      <button class="back" id="toLanding">← Översikt</button>
      ${beltPath(state.learnGup)}
      <article class="card">
        <div class="belt-head">
          <div class="big-belt">${beltSvg(belt.belt, 120)}</div>
          <div>
            <div class="eyebrow">Graderingskrav</div>
            <h2 class="display">${belt.gup} GUP</h2>
            <div class="sub">Bälte: ${esc(belt.color.toLowerCase())}</div>
          </div>
          <div class="actions">
            <a class="btn" href="${esc(belt.pdf)}" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
              Officiell PDF</a>
            <button class="btn primary" id="practiceThis">Öva på ${belt.gup} GUP</button>
          </div>
        </div>
        ${belt.inherits ? `<label class="toggle"><input type="checkbox" id="learnAll" ${state.learnAll ? 'checked' : ''}> Visa även tekniker och teori från tidigare bälten</label>` : ''}
        ${belt.inherits && !all ? `<p class="note">Samma som för tidigare bälte, med följande tillägg:</p>` : ''}
        <div class="sections">${secs}</div>
      </article>`);
    wireSearch();

    $view().querySelectorAll('.path button').forEach(btn => btn.addEventListener('click', () => {
      selectLearnBelt(+btn.dataset.gup);
    }));
    document.getElementById('toLanding').addEventListener('click', () => selectLearnBelt(null));
    const t = document.getElementById('learnAll');
    if (t) t.addEventListener('change', () => { state.learnAll = t.checked; renderLearn(); });
    document.getElementById('practiceThis').addEventListener('click', () => {
      state.practice.gups = new Set([belt.gup]);
      state.quiz = null;
      setTab('practice');
    });
  }

  /* ---------- Question bank ---------- */
  const TERM_GROUP = { stallningar: 'stallningar', slag: 'hand', stot: 'hand', blockeringar: 'blockeringar', sparkar: 'sparkar', teori: 'teori' };

  function trigrams(s) {
    const t = ' ' + s.toLowerCase().replace(/[^a-zåäö0-9 ]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
    const set = new Set();
    for (let i = 0; i < t.length - 2; i++) set.add(t.slice(i, i + 3));
    return set;
  }
  function similarity(a, b) {
    const A = trigrams(a), B = trigrams(b);
    let inter = 0; A.forEach(x => B.has(x) && inter++);
    return inter / (A.size + B.size - inter || 1);
  }
  /* Pick n distractors from candidates, favouring ones that look like the answer. */
  function hardDistractors(answer, candidates, n = 2) {
    const seen = new Set([normTxt(answer)]);
    const uniq = [];
    for (const c of candidates) { const k = normTxt(c); if (!seen.has(k) && k) { seen.add(k); uniq.push(c); } }
    const ranked = uniq.map(c => ({ c, s: similarity(answer, c) + Math.random() * 0.08 })).sort((x, y) => y.s - x.s);
    return shuffle(ranked.slice(0, Math.max(n + 3, 5))).slice(0, n).map(x => x.c);
  }
  /* For numeric/ordered facts: prefer values closest to the answer. */
  function nearDistractors(answer, values, dist, n = 2) {
    const seen = new Set([normTxt(answer)]);
    const uniq = values.filter(v => { const k = normTxt(v); if (seen.has(k)) return false; seen.add(k); return true; });
    const ranked = uniq.map(v => ({ v, d: dist(v) + Math.random() * 0.5 })).sort((a, b) => a.d - b.d);
    return shuffle(ranked.slice(0, n + 1)).slice(0, n).map(x => x.v);
  }

  let TERMS = null;
  function allTerms() {
    if (TERMS) return TERMS;
    const seen = new Set(); TERMS = [];
    for (const b of DATA.belts) {           // 9 GUP first: a term belongs to the belt that introduces it
      for (const [cat, group] of Object.entries(TERM_GROUP)) {
        for (const it of b.content[cat] || []) {
          if (!it.ko || !it.sv || it.count) continue;
          const k = itemKey(cat, it);
          if (seen.has(k)) continue;
          seen.add(k);
          TERMS.push({ gup: b.gup, cat, group, ko: it.ko, sv: it.sv });
        }
      }
    }
    const svCount = {};
    TERMS.forEach(t => { const k = normTxt(t.sv); svCount[k] = (svCount[k] || 0) + 1; });
    TERMS.forEach(t => { t.svUnique = svCount[normTxt(t.sv)] === 1; });
    return TERMS;
  }

  function mk(gup, cat, text, answer, distractors) {
    if (distractors.length < 2) return null;
    return { gup, cat, text, answer, options: shuffle([answer, ...distractors]) };
  }

  function termQuestion(t) {
    const pool = allTerms().filter(x => x.group === t.group && x !== t);
    const askKo = !t.svUnique || Math.random() < 0.55;
    if (askKo) {
      const cands = pool.filter(x => normTxt(x.sv) !== normTxt(t.sv) && normTxt(x.ko) !== normTxt(t.ko)).map(x => x.sv);
      return mk(t.gup, t.cat, `Vad betyder <em>${esc(t.ko)}</em>?`, t.sv, hardDistractors(t.sv, cands));
    }
    const cands = pool.filter(x => normTxt(x.sv) !== normTxt(t.sv)).map(x => x.ko);
    return mk(t.gup, t.cat, `Vad heter <em>${esc(t.sv)}</em> på koreanska?`, t.ko, hardDistractors(t.ko, cands));
  }

  function countQuestions(b) {
    const out = [];
    for (const it of b.content.teori || []) {
      if (!it.count) continue;
      const list = it.count, sino = b.gup !== 9;
      const label = sino ? 'första–tionde' : '1–10';
      shuffle(list.map((_, i) => i)).slice(0, 4).forEach(i => {
        const near = (v) => Math.abs(list.indexOf(v) - i);
        if (Math.random() < 0.5) {
          const word = list[i];
          out.push(mk(b.gup, 'teori', `Räkna ${label}: vad betyder <em>${esc(word)}</em>?`, String(i + 1),
            nearDistractors(String(i + 1), list.map((_, j) => String(j + 1)), v => Math.abs(+v - (i + 1)))));
        } else {
          out.push(mk(b.gup, 'teori', `Räkna ${label}: hur säger man <em>${i + 1}</em> på koreanska?`, list[i],
            nearDistractors(list[i], list, near)));
        }
      });
    }
    return out;
  }

  let KICKS = null;   // every kick / mittsteknik name in the curriculum (built once)
  function allKicks() {
    return KICKS || (KICKS = DATA.belts.flatMap(x => [...(x.content.sparkar || []), ...(x.content.mittsteknik || [])]).map(k => k.ko));
  }

  const firstOf = (belt, key) => belt.content[key]?.[0];
  /* Wrong "N GUP" answers: the grades closest to g. */
  const gupDistractors = g => nearDistractors(`${g} GUP`, DATA.belts.map(x => `${x.gup} GUP`), v => Math.abs(parseInt(v) - g));

  function factQuestions(b) {
    const belts = DATA.belts, g = b.gup, out = [];
    // Poomse name comes from the same content the Learn view shows (single source).
    const poomseOf = x => firstOf(x, 'poomse')?.ko;
    const poomse = poomseOf(b);
    const byGup = v => Math.abs(belts.find(x => poomseOf(x) === v)?.gup - g);
    out.push(mk(g, 'poomse', `Vilken poomse ska du kunna till <em>${g} GUP</em>?`, poomse,
      nearDistractors(poomse, belts.map(poomseOf), byGup)));
    out.push(mk(g, 'poomse', `Till vilket bälte hör poomse <em>${esc(poomse)}</em>?`, `${g} GUP`, gupDistractors(g)));
    // Mittsteknik: ask which technique the grading requires. Wrong answers are kicks from OTHER belts,
    // never this belt's own kicks or mittsteknik (those are also correct things to know for this grading).
    const own = new Set(['sparkar', 'mittsteknik'].flatMap(k => (b.content[k] || []).map(it => normTxt(it.ko))));
    const pool = allKicks().filter(ko => !own.has(normTxt(ko)));
    for (const it of b.content.mittsteknik || []) {
      out.push(mk(g, 'mittsteknik', `Vilken mittsteknik ska du kunna till <em>${g} GUP</em>?`, it.ko, hardDistractors(it.ko, pool)));
    }
    out.push(...countQuestions(b));
    out.push(...meaningQuestions(b));
    return out;
  }

  /* Bältets betydelse: what this belt stands for, what its colour is likened to, and the reverse. */
  /* Every belt meaning with its rank on the 10 GUP → 1 DAN scale (white = 10, black 1 DAN = 0). */
  let MEANINGS = null;
  function allMeanings() {
    return MEANINGS || (MEANINGS = [
      ...DATA.belts.map(x => ({ ...firstOf(x, 'betydelse'), rank: x.gup })).filter(m => m.text),
      ...(DATA.beltMeaningOther || []).map(o => ({ ...o, rank: o.gup ?? 1 - o.dan })),
    ]);
  }
  function meaningQuestions(b) {
    const g = b.gup, m = firstOf(b, 'betydelse'), out = [];
    if (!m) return out;
    const all = allMeanings();
    if (m.short) {
      const rankOf = new Map(all.filter(x => x.short).map(x => [x.short, x.rank]));
      out.push(mk(g, 'betydelse', `Vad betyder bältet för <em>${g} GUP</em>?`, m.short,
        nearDistractors(m.short, [...rankOf.keys()], v => Math.abs(rankOf.get(v) - g))));
      out.push(mk(g, 'betydelse', `Vilket bälte står för: <em>${esc(m.short)}</em>?`, `${g} GUP`, gupDistractors(g)));
    }
    if (m.symbol && m.colorAdj) {
      out.push(mk(g, 'betydelse', `Vad kan den <em>${esc(m.colorAdj)}</em> färgen liknas vid?`, m.symbol,
        hardDistractors(m.symbol, all.map(x => x.symbol).filter(Boolean))));
    }
    return out;
  }

  function buildPool() {
    const { gups, cumulative } = state.practice;
    if (!gups.size) return [];
    // Cumulative: a grading to N GUP also tests everything introduced from 9 GUP up to N GUP.
    const lo = Math.min(...gups);
    const termGups = cumulative ? new Set(DATA.belts.filter(b => b.gup >= lo).map(b => b.gup)) : gups;

    return [
      ...allTerms().filter(t => termGups.has(t.gup)).map(termQuestion),
      ...DATA.belts.filter(b => gups.has(b.gup)).flatMap(factQuestions),
    ].filter(Boolean);
  }
  function buildQuiz() {
    const qs = buildPool(), count = state.practice.count;
    return shuffle(qs).slice(0, count === 0 ? qs.length : count);
  }



  /* ---------- Practice: setup ---------- */
  function renderSetup() {
    const p = state.practice;
    const allSel = p.gups.size === DATA.belts.length;
    const n = buildPool().length;
    const counts = [[10, '10'], [20, '20'], [30, '30'], [0, 'Alla']];
    $view().innerHTML = `
      <section class="card setup">
        <div class="eyebrow">Öva inför gradering</div>
        <h2 class="display">Quiz</h2>
        <p class="lead">Välj ett eller flera bälten. Varje fråga har tre svarsalternativ, och fel svar är valda för att likna det rätta.</p>

        <div class="field">
          <div class="lbl">Bälten</div>
          ${beltPicker(p.gups, true)}
          <button class="btn" id="selAll">${allSel ? 'Rensa' : 'Välj alla bälten'}</button>
        </div>

        <div class="field">
          <label class="check"><input type="checkbox" id="cum" ${p.cumulative ? 'checked' : ''}>
            <span>Inkludera tekniker och teori från tidigare bälten
            <small>Graderingen kräver allt från tidigare bälten också.</small></span></label>
        </div>

        <div class="field">
          <div class="lbl">Antal frågor</div>
          <div class="seg" role="group">${counts.map(([v, l]) => `<button data-count="${v}" aria-pressed="${p.count === v}">${l}</button>`).join('')}</div>
        </div>

        <div class="start-row">
          <button class="btn primary" id="start" ${p.gups.size ? '' : 'disabled'}>Starta quiz</button>
          <span class="count">${p.gups.size ? `${n} frågor finns för ditt val` : 'Välj minst ett bälte'}</span>
        </div>
      </section>`;

    $view().querySelectorAll('.belt-btn').forEach(btn => btn.addEventListener('click', () => {
      const g = +btn.dataset.gup;
      p.gups.has(g) ? p.gups.delete(g) : p.gups.add(g);
      renderSetup();
    }));
    document.getElementById('selAll').addEventListener('click', () => {
      p.gups = allSel ? new Set() : new Set(DATA.belts.map(b => b.gup));
      renderSetup();
    });
    document.getElementById('cum').addEventListener('change', e => { p.cumulative = e.target.checked; renderSetup(); });
    $view().querySelectorAll('[data-count]').forEach(b => b.addEventListener('click', () => { p.count = +b.dataset.count; renderSetup(); }));
    document.getElementById('start').addEventListener('click', () => startQuiz(buildQuiz()));
  }

  function startQuiz(questions) {
    state.quiz = { questions, i: 0, answered: null, score: 0, missed: [], done: false };
    render();
    window.scrollTo({ top: 0 });
  }

  /* ---------- Practice: question ---------- */
  function renderQuestion() {
    const q = state.quiz, cur = q.questions[q.i], belt = beltBy(cur.gup);
    const answered = q.answered !== null;
    const pct = ((q.i + (answered ? 1 : 0)) / q.questions.length) * 100;
    const last = q.i === q.questions.length - 1;

    $view().innerHTML = `
      <section class="card quiz">
        <div class="progress"><div style="width:${pct}%"></div></div>
        <div class="qmeta">
          <span>Fråga ${q.i + 1} av ${q.questions.length}</span>
          <span class="qtag">${beltSvg(belt.belt, 34)} ${cur.gup} GUP · ${esc(DATA.sections[cur.cat])}</span>
        </div>
        <div class="question">${cur.text}</div>
        <div class="options">
          ${cur.options.map((o, idx) => {
            let cls = '';
            if (answered) { if (o === cur.answer) cls = 'correct'; else if (o === q.answered) cls = 'wrong'; }
            return `<button class="opt ${cls}" data-idx="${idx}" ${answered ? 'disabled' : ''}><span class="key">${idx + 1}</span><span>${esc(o)}</span></button>`;
          }).join('')}
        </div>
        <div class="feedback">
          ${answered
            ? `<span class="msg ${q.answered === cur.answer ? 'ok' : 'bad'}">${q.answered === cur.answer ? 'Rätt!' : 'Fel. Rätt svar är markerat.'}</span>
               <button class="btn primary" id="next">${last ? 'Visa resultat' : 'Nästa fråga'}</button>`
            : `<span class="msg" style="color:var(--muted);font-weight:500">Välj ett svar</span>`}
        </div>
        <div class="quiz-foot"><span>Poäng: ${q.score}</span><button class="linkbtn" id="quit">Avsluta</button></div>
      </section>`;

    $view().querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => answer(+b.dataset.idx)));
    const next = document.getElementById('next');
    if (next) { next.addEventListener('click', advance); next.focus({ preventScroll: true }); }
    document.getElementById('quit').addEventListener('click', () => { state.quiz = null; render(); });
  }

  function answer(idx) {
    const q = state.quiz, cur = q.questions[q.i];
    if (q.answered !== null) return;
    q.answered = cur.options[idx];
    if (q.answered === cur.answer) q.score++;
    else q.missed.push({ ...cur, given: q.answered });
    renderQuestion();
  }

  function advance() {
    const q = state.quiz;
    if (q.answered === null) return;
    if (q.i === q.questions.length - 1) q.done = true;
    else { q.i++; q.answered = null; }
    render();
  }

  function onKey(e) {
    if (state.tab !== 'practice' || !state.quiz || state.quiz.done) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.closest && e.target.closest('input')) return;
    if (['1', '2', '3'].includes(e.key)) answer(+e.key - 1);
    else if (e.key === 'Enter' && state.quiz.answered !== null) {
      const a = document.activeElement;
      if (!a || a === document.body) advance();   // a focused button handles Enter itself
    }
  }

  /* ---------- Practice: result ---------- */
  function renderResult() {
    const q = state.quiz, total = q.questions.length, pct = q.score / total;
    const verdict = pct === 1 ? 'Perfekt! Du är redo.' : pct >= 0.8 ? 'Riktigt bra jobbat!' : pct >= 0.5 ? 'Bra! Öva lite till på de du missade.' : 'Fortsätt öva, du lär dig!';
    $view().innerHTML = `
      <section class="card result">
        <div class="eyebrow">Resultat</div>
        <div class="score display">${q.score}<span> / ${total}</span></div>
        <div class="verdict">${verdict}</div>
        <div class="actions">
          ${q.missed.length ? `<button class="btn primary" id="retryMissed">Öva på missade (${q.missed.length})</button>` : ''}
          <button class="btn ${q.missed.length ? '' : 'primary'}" id="again">Ny quiz</button>
          <button class="btn" id="setup">Ändra inställningar</button>
        </div>
        ${q.missed.length ? `<div class="missed"><h3>Missade frågor</h3><ul>
          ${q.missed.map(m => `<li>
            <div class="q">${m.text.replace(/<\/?em>/g, '')}</div>
            <div class="a">✓ ${esc(m.answer)}</div>
            <div class="y">${esc(m.given)}</div>
            <div class="src">${m.gup} GUP · ${esc(DATA.sections[m.cat])}</div>
          </li>`).join('')}</ul></div>` : ''}
      </section>`;

    const rm = document.getElementById('retryMissed');
    if (rm) rm.addEventListener('click', () => startQuiz(shuffle(q.missed.map(({ given, ...m }) => ({ ...m, options: shuffle(m.options) })))));
    document.getElementById('again').addEventListener('click', () => startQuiz(buildQuiz()));
    document.getElementById('setup').addEventListener('click', () => { state.quiz = null; render(); });
  }
})();
</script>
</body>
</html>
